name: fnms_lab2
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab2
      POSTGRES_PASSWORD: lab2_local
      POSTGRES_DB: lab2
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["lab2_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab2 -d lab2"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  lab2_data:

